# Configuration utilisée UNIQUEMENT par les tests (./mvnw test).
# Elle remplace src/main/resources/application.properties : on y remet donc
# toutes les propriétés nécessaires, mais avec une base H2 en mémoire
# à la place de Postgres. La base est vide à chaque lancement des tests
# et aucune donnée n'est écrite dans la vraie base.

spring.application.name=notes-api
server.servlet.context-path=/api

# Secret de test (fixe, sans valeur réelle, au moins 32 caractères)
jwt.secret=test-secret-key-only-for-tests-at-least-32-chars
jwt.expiration-minutes=60

# Base H2 en mémoire, en mode compatible PostgreSQL
spring.datasource.url=jdbc:h2:mem:notes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
