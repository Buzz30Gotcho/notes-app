spring.config.import=optional:file:../.env[.properties]

spring.application.name=notes-api
server.port=8087
server.servlet.context-path=/api
# Clé HS256 : au moins 32 caractères. En prod, passer JWT_SECRET en variable d'env.
jwt.secret=${JWT_SECRET:jwtsecretkey}
jwt.expiration-minutes=60


# Base de données
spring.datasource.url=jdbc:postgresql://localhost:5433/notes
spring.datasource.username=${DB_USERNAME:notes}
spring.datasource.password=${DB_PASSWORD:notes}

# Hibernate crée/met à jour les tables à partir des entités
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
