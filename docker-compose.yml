services:
  db:
    image: postgres:16
    container_name: notes-db
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: ${DB_USERNAME:-notes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-notes}
    ports:
      - "5433:5432"
    volumes:
      - notes-pgdata:/var/lib/postgresql/data

volumes:
  notes-pgdata:
