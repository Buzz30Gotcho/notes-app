name: CI API

# Déclenché sur les Pull Requests qui touchent le back ou le partagé.
on:
  pull_request:
    paths:
      - 'api/**'
      - 'shared/**'
      - 'contracts/**'
      - '.github/workflows/ci-api.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode test
